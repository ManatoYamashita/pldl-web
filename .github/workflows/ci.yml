name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # microCMS の値はダミー。secrets を CI に渡さずに済む代わりに、ビルド時の取得は失敗して
      # 各ページは notFound で生成される。型・バンドル・プリレンダーの失敗はこれで検出でき、
      # 実データでのビルドは Vercel の Preview で確かめる
      - run: pnpm build
        env:
          MICROCMS_SERVICE_DOMAIN: ci-dummy
          MICROCMS_API_KEY: ci-dummy
          BASE_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: '1'
